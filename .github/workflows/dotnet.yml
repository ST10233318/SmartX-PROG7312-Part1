name: SmartX .NET build and tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SmartX.slnx
      - run: dotnet build SmartX.slnx --no-restore
      - run: dotnet test SmartX.slnx --no-build
